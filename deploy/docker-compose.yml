# RADAR Kenya — protected webapp deployment (LAN/VPN pilot).
# Run from the repository root:
#   cp deploy/.env.example deploy/.env   # then set RADAR_AUTH_HASH
#   docker compose -f deploy/docker-compose.yml up -d --build
# Details: deploy/README.md
name: radar-ke

services:
  webapp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: radar-ke:latest
    restart: unless-stopped
    environment:
      RADAR_CASE_HISTORY_DIR: /data/cases
      MODEL_ROOT: /app/ckpt
      CONFIGS_ROOT: /app/ckpt
      HF_HOME: /data/hf-cache
      MPLCONFIGDIR: /tmp/mpl
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      # Relative bind paths resolve against the compose file's directory (deploy/),
      # so the repo-root ckpt is ../ckpt.
      - ../ckpt:/app/ckpt:ro
      - radar-data:/data
      # Share the host case-history store with the local dev instance so saved
      # reviews appear in both. Overlays the volume's /data/cases mountpoint.
      - ${HOME}/.radar_ke/cases:/data/cases
    # CT volumes are large and the inference DataLoader (num_workers=12) passes
    # them between processes via /dev/shm; the Docker default (64 MB) is far too
    # small and causes "unable to allocate shared memory(shm)" errors.
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose:
      - "8501"
    healthcheck:
      # Also import the app modules so a permission/import fault fails the
      # health check instead of only breaking every user session.
      test: ["CMD", "python3", "-c",
             "import sys, urllib.request; sys.path.insert(0, '/app/webapp'); import cine, review; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - webapp
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Every address the proxy answers on (comma-separated). Include the host's
      # LAN IPs so phones/laptops can reach it without editing their hosts file.
      CADDY_SITE_ADDRESSES: ${CADDY_SITE_ADDRESSES:-radar.localhost}
      # Certificate served when a client sends no SNI (bare-IP URLs).
      CADDY_DEFAULT_SNI: ${CADDY_DEFAULT_SNI:-radar.localhost}
      RADAR_AUTH_USER: ${RADAR_AUTH_USER:-radiologist}
      RADAR_AUTH_HASH: ${RADAR_AUTH_HASH:?set RADAR_AUTH_HASH in deploy/.env — see deploy/README.md}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Probe the admin API rather than http://127.0.0.1:80/: port 80 issues an
      # automatic HTTP->HTTPS redirect to a name the internal cert doesn't cover,
      # so wget fails the TLS handshake and reports a false negative.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  radar-data:
  caddy-data:
  caddy-config: